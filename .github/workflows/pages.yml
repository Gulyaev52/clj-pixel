name: Deploy to GitHub Pages

on:
  workflow_dispatch: # manual trigger only

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; do not cancel an in-progress deploy
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/build.yml

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4 # committed static assets (index.html, gif.js, imgs)
      - uses: actions/download-artifact@v4 # overlay compiled js + css from the build job
        with:
          name: web-build
          path: resources/public
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: resources/public
      - id: deployment
        uses: actions/deploy-pages@v4
