name: Build

on:
  workflow_call:

jobs:
  build:
    name: Build (release + css)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      # Cache shadow-cljs Maven deps + compile cache
      - uses: actions/cache@v4
        with:
          path: |
            ~/.m2
            .shadow-cljs
          key: cljs-${{ runner.os }}-${{ hashFiles('shadow-cljs.edn') }}
          restore-keys: cljs-${{ runner.os }}-
      - run: npm ci
      - run: npm run release
      - run: npm run css
      - uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: |
            resources/public/js/compiled
            resources/public/css
          retention-days: 1
